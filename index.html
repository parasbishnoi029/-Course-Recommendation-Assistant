<!DOCTYPE html>

<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Course Assistant</title>

<style>
:root {
  --bg1: #1e3c72;
  --bg2: #2a5298;
  --glass: rgba(255,255,255,0.1);
  --bot: #2b2b2b;
  --user: #00c6ff;
  --text: #fff;
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
  color: var(--text);
}

.dark {
  --bg1: #0f0f0f;
  --bg2: #1a1a1a;
  --bot: #1f1f1f;
}

.hero {
  text-align: center;
  padding: 80px 20px;
}
.hero h1 { font-size: 42px; margin: 0; }
.hero p { opacity: 0.8; }

.chat-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: linear-gradient(135deg,#00c6ff,#0072ff);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 28px;
  cursor: pointer;
}

.chat-box {
  position: fixed;
  bottom: 100px;
  right: 20px;
  width: 360px;
  height: 520px;
  background: var(--glass);
  backdrop-filter: blur(12px);
  border-radius: 15px;
  display: none;
  flex-direction: column;
  overflow: hidden;
}

.chat-header {
  padding: 12px;
  background: rgba(0,0,0,0.3);
  display: flex;
  justify-content: space-between;
}

.chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.message {
  display: flex;
  gap: 8px;
  margin: 8px 0;
}

.bubble {
  padding: 10px;
  border-radius: 10px;
  max-width: 70%;
}

.user .bubble { background: var(--user); }
.bot .bubble { background: var(--bot); }

.avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
}

.chat-footer {
  display: flex;
  border-top: 1px solid rgba(255,255,255,0.2);
}

.chat-footer input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
}

.chat-footer button {
  padding: 10px;
  border: none;
  background: #0072ff;
  color: white;
  cursor: pointer;
}

.quick {
  padding: 5px;
}
.quick button {
  margin: 3px;
  padding: 5px;
  border: none;
  background: #444;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="hero">
  <h1>🎓 AI Course Assistant</h1>
  <p>Smart learning powered by AI</p>
</div>

<div class="chat-btn" onclick="toggleChat()">💬</div>

<div class="chat-box" id="chatBox">
  <div class="chat-header">
    AI Assistant
    <div>
      <span onclick="toggleDark()">🌓</span>
      <span onclick="exportChat()">⬇️</span>
    </div>
  </div>

  <div class="chat-body" id="chat"></div>

  <div class="quick">
    <button onclick="quickMsg('I want to learn AI')">AI</button>
    <button onclick="quickMsg('Web development')">Web</button>
    <button onclick="quickMsg('Data science')">Data</button>
  </div>

  <div class="chat-footer">
    <input id="input" placeholder="Type..." />
    <button onclick="sendMessage()">➤</button>
    <button onclick="startVoice()">🎤</button>
  </div>
</div>

<script>
const API = "YOUR_FLOWISE_API_URL";

// toggle chat
function toggleChat() {
  const box = document.getElementById("chatBox");
  box.style.display = box.style.display === "flex" ? "none" : "flex";
}

// dark mode
function toggleDark() {
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", document.body.classList.contains("dark"));
}
if (localStorage.getItem("dark") === "true") toggleDark();

// quick buttons
function quickMsg(text) {
  document.getElementById("input").value = text;
  sendMessage();
}

// add message
function addMessage(role, text) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "message " + role;
  div.innerHTML = `
    <img class="avatar" src="https://i.pravatar.cc/30?img=${role==='user'?3:5}">
    <div class="bubble">${text}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// streaming effect
function streamText(text, element) {
  let i = 0;
  function type() {
    if (i < text.length) {
      element.innerHTML += text.charAt(i);
      i++;
      setTimeout(type, 10);
    }
  }
  type();
}

// send message
async function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text) return;

  addMessage("user", text);
  input.value = "";

  const chat = document.getElementById("chat");
  const typing = document.createElement("div");
  typing.innerHTML = "Typing...";
  chat.appendChild(typing);

  const res = await fetch(API, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ question: text })
  });

  const data = await res.json();
  typing.remove();

  const msgDiv = document.createElement("div");
  msgDiv.className = "message bot";
  msgDiv.innerHTML = `<img class="avatar" src="https://i.pravatar.cc/30?img=5"><div class="bubble"></div>`;
  chat.appendChild(msgDiv);

  streamText(data.text, msgDiv.querySelector(".bubble"));

  // speak
  const speech = new SpeechSynthesisUtterance(data.text);
  speechSynthesis.speak(speech);

  saveChat();
}

// voice input
function startVoice() {
  const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.onresult = e => {
    document.getElementById("input").value = e.results[0][0].transcript;
    sendMessage();
  };
  rec.start();
}

// save chat
function saveChat() {
  localStorage.setItem("chat", document.getElementById("chat").innerHTML);
}
window.onload = () => {
  const saved = localStorage.getItem("chat");
  if (saved) document.getElementById("chat").innerHTML = saved;
};

// export
function exportChat() {
  const text = document.getElementById("chat").innerText;
  const blob = new Blob([text], {type: "text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "chat.txt";
  a.click();
}

// enter key
document.getElementById("input").addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
