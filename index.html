<body>

<!-- Floating Button -->

<div class="chat-btn" onclick="toggleChat()">💬</div>

<!-- Chat Box -->

<div class="chat-box" id="chatBox">
  <div class="chat-header">AI Assistant</div>
  <div class="chat-body" id="chat"></div>
  <div class="chat-footer">
    <input id="input" placeholder="Type..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
function toggleChat() {
  const box = document.getElementById("chatBox");
  box.style.display = box.style.display === "flex" ? "none" : "flex";
}

async function sendMessage() {
  const inputBox = document.getElementById("input");
  const chat = document.getElementById("chat");
  const text = inputBox.value;

  if (!text) return;

  chat.innerHTML += `<div class="message user">${text}</div>`;
  inputBox.value = "";

  // Typing indicator
  chat.innerHTML += `<div class="message bot" id="typing">Typing...</div>`;
  chat.scrollTop = chat.scrollHeight;

  const res = await fetch( "https://cloud.flowiseai.com/api/v1/prediction/1de7fac7-9c55-4c32-8076-0eb18bedfe6a", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      question: text
    })
  });

  const data = await res.json();

  document.getElementById("typing").remove();
  chat.innerHTML += `<div class="message bot">${data.text}</div>`;
  chat.scrollTop = chat.scrollHeight;
}

// Enter key support
document.getElementById("input").addEventListener("keypress", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
