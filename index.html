<!DOCTYPE html>

<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Course Assistant</title>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  color:white;
}

.hero {
  padding:80px;
  text-align:center;
}

.chat-btn {
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
  height:60px;
  background:#0072ff;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

.chat-box {
  position:fixed;
  bottom:90px;
  right:20px;
  width:350px;
  height:500px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  display:none;
  flex-direction:column;
}

.chat-body {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.message {
  margin:5px 0;
}
.user {text-align:right;}
.bot {text-align:left;}

.chat-footer {
  display:flex;
}

.chat-footer input {
  flex:1;
  padding:10px;
}

.chat-footer button {
  padding:10px;
}
</style>

</head>

<body>

<div class="hero">
  <h1>🎓 AI Course Assistant</h1>
  <p>Voice-enabled smart learning</p>
</div>

<div class="chat-btn" onclick="toggleChat()">💬</div>

<div class="chat-box" id="chatBox">
  <div class="chat-body" id="chat"></div>

  <div class="chat-footer">
    <input id="input" placeholder="Ask..." />
    <button onclick="sendMessage()">➤</button>
    <button onclick="startVoice()">🎤</button>
    <button onclick="toggleVoice()">🔊</button>
    <button onclick="stopVoice()">🛑</button>
  </div>
</div>

<script>
const API =  "https://cloud.flowiseai.com/api/v1/prediction/1de7fac7-9c55-4c32-8076-0eb18bedfe6a";
let voiceEnabled = true;

function toggleChat(){
  const box=document.getElementById("chatBox");
  box.style.display=box.style.display==="flex"?"none":"flex";
}

function add(role,text){
  const chat=document.getElementById("chat");
  chat.innerHTML+=`<div class="message ${role}">${text}</div>`;
  chat.scrollTop=chat.scrollHeight;
}

// SEND MESSAGE
async function sendMessage(){
  const input=document.getElementById("input");
  const text=input.value;
  if(!text) return;

  add("user",text);
  input.value="";

  add("bot","Typing...");

  try{
    const res=await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:text})
    });

    const data=await res.json();
    document.getElementById("chat").lastChild.remove();
    add("bot",data.text);

    // VOICE OUTPUT
    if(voiceEnabled){
      const shortText = data.text.slice(0,300);
      speechSynthesis.cancel();
      speechSynthesis.speak(new SpeechSynthesisUtterance(shortText));
    }

  }catch(e){
    add("bot","Error: API not responding");
  }
}

// VOICE INPUT
function startVoice(){
  const input=document.getElementById("input");
  input.placeholder="🎤 Listening...";

  const rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();

  rec.onresult=e=>{
    input.placeholder="Ask...";
    input.value=e.results[0][0].transcript;
    sendMessage();
  };

  rec.onerror=()=>{
    input.placeholder="Mic error";
  };

  rec.start();
}

// STOP VOICE
function stopVoice(){
  speechSynthesis.cancel();
}

// TOGGLE VOICE
function toggleVoice(){
  voiceEnabled=!voiceEnabled;
  alert("Voice " + (voiceEnabled?"ON":"OFF"));
}

// ENTER KEY
document.getElementById("input").addEventListener("keypress",e=>{
  if(e.key==="Enter") sendMessage();
});
</script>

</body>
</html>
