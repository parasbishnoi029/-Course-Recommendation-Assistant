<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Course Assistant</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  color: white;
}

/* HERO */
.hero {
  text-align: center;
  padding: 80px 20px;
}
.hero h1 {
  font-size: 40px;
}
.hero p {
  opacity: 0.8;
}

/* DARK MODE */
.dark {
  background: #111;
}

/* CHAT BUTTON */
.chat-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  border-radius: 50%;
  width: 65px;
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  cursor: pointer;
  box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

/* CHAT BOX */
.chat-box {
  position: fixed;
  bottom: 100px;
  right: 20px;
  width: 350px;
  height: 500px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(15px);
  border-radius: 15px;
  display: none;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER */
.chat-header {
  padding: 12px;
  background: rgba(0,0,0,0.3);
  font-weight: bold;
  display: flex;
  justify-content: space-between;
}

/* BODY */
.chat-body {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

/* MESSAGE */
.message {
  margin: 8px 0;
  padding: 10px;
  border-radius: 10px;
  max-width: 75%;
  display: flex;
  gap: 8px;
}

.user {
  background: #00c6ff;
  align-self: flex-end;
}

.bot {
  background: #333;
}

/* AVATAR */
.avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
}

/* FOOTER */
.chat-footer {
  display: flex;
  border-top: 1px solid rgba(255,255,255,0.2);
}

.chat-footer input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
}

.chat-footer button {
  padding: 10px;
  border: none;
  background: #0072ff;
  color: white;
}

/* TOGGLE */
.toggle {
  cursor: pointer;
}
</style>

</head>

<body>

<div class="hero">
  <h1>🎓 AI Course Assistant</h1>
  <p>Smart learning path powered by AI</p>
</div>

<!-- CHAT BUTTON -->

<div class="chat-btn" onclick="toggleChat()">💬</div>

<!-- CHAT BOX -->

<div class="chat-box" id="chatBox">
  <div class="chat-header">
    AI Assistant
    <span class="toggle" onclick="toggleDark()">🌓</span>
  </div>

  <div class="chat-body" id="chat"></div>

  <div class="chat-footer">
    <input id="input" placeholder="Ask anything..." />
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
function toggleChat() {
  const box = document.getElementById("chatBox");
  box.style.display = box.style.display === "flex" ? "none" : "flex";
}

function toggleDark() {
  document.body.classList.toggle("dark");
}

async function sendMessage() {
  const inputBox = document.getElementById("input");
  const chat = document.getElementById("chat");
  const text = inputBox.value;

  if (!text) return;

  chat.innerHTML += `
    <div class="message user">
      <img class="avatar" src="https://i.pravatar.cc/30?img=3">
      ${text}
    </div>
  `;

  inputBox.value = "";

  chat.innerHTML += `
    <div class="message bot" id="typing">
      <img class="avatar" src="https://i.pravatar.cc/30?img=5">
      Typing...
    </div>
  `;

  chat.scrollTop = chat.scrollHeight;

  const res = await fetch( "https://cloud.flowiseai.com/api/v1/prediction/1de7fac7-9c55-4c32-8076-0eb18bedfe6a", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ question: text })
  });

  const data = await res.json();

  document.getElementById("typing").remove();

  chat.innerHTML += `
    <div class="message bot">
      <img class="avatar" src="https://i.pravatar.cc/30?img=5">
      ${data.text}
    </div>
  `;

  chat.scrollTop = chat.scrollHeight;
}

// Enter key
document.getElementById("input").addEventListener("keypress", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
