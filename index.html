<!DOCTYPE html>

<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Course Assistant</title>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  color:white;
}

/* HERO */
.hero {
  background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
  url('https://images.unsplash.com/photo-1519389950473-47ba0277781c');
  background-size:cover;
  padding:100px 20px;
  text-align:center;
}
.hero h1 {font-size:42px;}
.hero p {opacity:0.8;}

/* COURSE CARDS */
.cards {
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:center;
  padding:40px;
}
.card {
  width:260px;
  background:white;
  color:black;
  border-radius:10px;
  overflow:hidden;
}
.card img {width:100%;}
.card div {padding:10px;}

/* STATS */
.stats {
  text-align:center;
  padding:40px;
  background:#111;
}

/* FOOTER */
.footer {
  text-align:center;
  padding:20px;
  background:black;
}

/* CHAT */
.chat-btn {
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
  height:60px;
  background:#0072ff;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

.chat-box {
  position:fixed;
  bottom:90px;
  right:20px;
  width:350px;
  height:500px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  display:none;
  flex-direction:column;
}

.chat-body {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.message {
  margin:5px 0;
}

.user {text-align:right;}
.bot {text-align:left;}

.chat-footer {
  display:flex;
}
.chat-footer input {
  flex:1;
  padding:10px;
}
.chat-footer button {
  padding:10px;
}
</style>

</head>

<body>

<!-- HERO -->

<div class="hero">
  <h1>🎓 AI Course Assistant</h1>
  <p>Find the best courses instantly with AI</p>
</div>

<!-- CARDS -->

<div class="cards">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1555949963-aa79dcee981c">
    <div>
      <h3>Machine Learning</h3>
      <p>⭐ 4.8 | ₹999</p>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1518770660439-4636190af475">
    <div>
      <h3>Web Development</h3>
      <p>⭐ 4.7 | ₹799</p>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1526378722484-bd91ca387e72">
    <div>
      <h3>Data Science</h3>
      <p>⭐ 4.9 | ₹1199</p>
    </div>
  </div>
</div>

<!-- STATS -->

<div class="stats">
  <h2>Trusted by Learners</h2>
  <p>👥 10,000+ Users</p>
  <p>📚 500+ Courses</p>
</div>

<!-- FOOTER -->

<div class="footer">
  <p>Made by Paras 🚀</p>
</div>

<!-- CHAT -->

<div class="chat-btn" onclick="toggleChat()">💬</div>

<div class="chat-box" id="chatBox">
  <div class="chat-body" id="chat"></div>
  <div class="chat-footer">
    <input id="input" placeholder="Ask..." />
    <button onclick="sendMessage()">➤</button>
    <button onclick="voice()">🎤</button>
  </div>
</div>

<script>
const API =  "https://cloud.flowiseai.com/api/v1/prediction/1de7fac7-9c55-4c32-8076-0eb18bedfe6a";

function toggleChat(){
  const box=document.getElementById("chatBox");
  box.style.display=box.style.display==="flex"?"none":"flex";
}

function add(role,text){
  const chat=document.getElementById("chat");
  chat.innerHTML+=`<div class="message ${role}">${text}</div>`;
  chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(){
  const input=document.getElementById("input");
  const text=input.value;
  if(!text) return;

  add("user",text);
  input.value="";

  add("bot","Typing...");

  const res=await fetch(API,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({question:text})
  });

  const data=await res.json();
  document.getElementById("chat").lastChild.remove();
  add("bot",data.text);

  speechSynthesis.speak(new SpeechSynthesisUtterance(data.text));
}

function voice(){
  const rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
  rec.onresult=e=>{
    document.getElementById("input").value=e.results[0][0].transcript;
    sendMessage();
  };
  rec.start();
}

document.getElementById("input").addEventListener("keypress",e=>{
  if(e.key==="Enter") sendMessage();
});
</script>

</body>
</html>
